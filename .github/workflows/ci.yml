name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGSUPER: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://fc_owner:fc_owner_dev@localhost:5432/fc_test
      DATABASE_URL: postgres://fc_app:fc_app_dev@localhost:5432/fc_test
      PROVIDER_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: scripts/dev-db.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Generated JSON Schemas match the Zod contracts
        run: npm run contracts:export && git diff --exit-code -- src/contracts/generated
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run e2e -- --trace off
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: tests/e2e/output/
